{# Branding row for full-screen TV boards (no Tailwind there, so inline styles): three equal-size logos, centered. #}
<div style="display:flex;justify-content:center;align-items:center;gap:2.5vmin;flex-shrink:0">
  <img src="/static/ansports-logo.png" alt="AN Sports Dubai"
       style="height:8vmin;width:8vmin;object-fit:contain" onerror="this.style.display='none'"/>
  <img src="/static/tournament-logo.png" alt="Milad Table Tennis 2026"
       style="height:8vmin;width:8vmin;object-fit:contain" onerror="this.style.display='none'"/>
  <img src="/static/fcc-logo.png" alt="Friends Cricket Club"
       style="height:8vmin;width:8vmin;object-fit:contain" onerror="this.style.display='none'"/>
</div>
