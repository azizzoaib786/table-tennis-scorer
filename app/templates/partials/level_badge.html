{% macro level_badge(level) -%}
{%- if level -%}
<span title="{{ level }}" class="inline-block align-middle text-[9px] leading-none font-bold px-1.5 py-0.5 rounded-full border
  {% if level == 'Advanced' %}bg-rose-100 text-rose-700 border-rose-300
  {% elif level == 'Intermediate' %}bg-amber-100 text-amber-700 border-amber-300
  {% else %}bg-emerald-100 text-emerald-700 border-emerald-300{% endif %}">{{ level[0] }}</span>
{%- endif -%}
{%- endmacro %}
