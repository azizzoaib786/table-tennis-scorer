{# Three logos, identical size, centered in one row. #}
<div class="mb-3 sm:mb-4">
  <div class="flex items-center justify-center gap-3 sm:gap-6">
    <img src="/static/ansports-logo.png"
         alt="AN Sports Dubai"
         class="h-20 w-20 sm:h-28 sm:w-28 object-contain drop-shadow"
         onerror="this.style.display='none'"/>

    <img src="/static/tournament-logo.png"
         alt="Milad Table Tennis 2026"
         class="h-20 w-20 sm:h-28 sm:w-28 object-contain drop-shadow"
         onerror="this.style.display='none'"/>

    <img src="/static/fcc-logo.png"
         alt="Friends Cricket Club"
         class="h-20 w-20 sm:h-28 sm:w-28 object-contain drop-shadow"
         onerror="this.style.display='none'"/>
  </div>
</div>
