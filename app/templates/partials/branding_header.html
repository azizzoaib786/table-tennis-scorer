{# Original three-logo header: sponsor left, center tournament badge, sponsor right. #}
<div class="mb-3 sm:mb-4">
  <div class="flex items-center justify-center gap-2 sm:gap-4 md:gap-6">
    <img src="/static/ansports-logo.png"
         alt="AN Sports Dubai"
         class="h-10 w-auto sm:h-12 md:h-14 drop-shadow"
         onerror="this.style.display='none'"/>

    <img src="/static/tournament-logo.png"
         alt="Milad Table Tennis 2026"
         class="w-full max-w-[520px] md:max-w-[640px] h-auto drop-shadow-xl"
         onerror="this.style.display='none'"/>

    <img src="/static/fcc-logo.png"
         alt="Friends Cricket Club"
         class="h-10 w-auto sm:h-12 md:h-14 drop-shadow"
         onerror="this.style.display='none'"/>
  </div>
</div>
