{# Three logos, identical height (width follows each logo's aspect ratio), centered. #}
<div class="mb-3 sm:mb-4">
  <div class="flex items-center justify-center gap-4 sm:gap-8">
    <img src="/static/ansports-logo.png"
         alt="AN Sports Dubai"
         class="h-20 sm:h-32 w-auto object-contain drop-shadow"
         onerror="this.style.display='none'"/>

    <img src="/static/tournament-logo.png"
         alt="Milad Table Tennis 2026"
         class="h-20 sm:h-32 w-auto object-contain drop-shadow"
         onerror="this.style.display='none'"/>

    <img src="/static/fcc-logo.png"
         alt="Friends Cricket Club"
         class="h-20 sm:h-32 w-auto object-contain drop-shadow"
         onerror="this.style.display='none'"/>
  </div>
</div>
