<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <title>{{ tournament.name }} — TT Scorer</title>
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />
  </head>
  <body class="bg-gradient-to-br from-sky-100 via-indigo-100 to-emerald-100 min-h-screen">
    <div class="max-w-3xl mx-auto p-3 sm:p-4">
      <div class="bg-white rounded-2xl border-2 border-sky-200 shadow-xl p-5">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">🏆</span>
              <h1 class="text-xl sm:text-2xl font-bold text-sky-900 truncate">{{ tournament.name }}</h1>
            </div>
            <p class="text-sky-700 text-sm font-medium">Bo{{ tournament.best_of }} • First to {{ tournament.points_to_win }}</p>
          </div>
          <a href="/" class="px-3 py-2 rounded-xl border-2 border-sky-200 bg-sky-50 text-sky-800 font-semibold">🏠</a>
        </div>
      </div>

      <div id="tournament-body" class="mt-3 sm:mt-4">
        {% include "partials/tournament_body.html" %}
      </div>

      <div class="mt-4 text-center pb-4">
        <p class="text-sm text-sky-700 font-medium">🏓 <span class="font-bold bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">Table Tennis Scorer</span></p>
        <p class="text-xs text-sky-600 mt-1">Created with ❤️ by <a href="https://azizzoaib.com" target="_blank" rel="noopener" class="font-semibold hover:underline">Aziz Zoaib</a></p>
      </div>
    </div>
  </body>
</html>
