<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Register — TT Scorer</title>
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#059669" />
  </head>
  <body class="bg-gradient-to-br from-emerald-100 via-teal-100 to-sky-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <div class="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-3xl border-2 border-emerald-300 shadow-2xl p-8">
        <div class="text-center mb-6">
          <div class="text-6xl mb-3">🏓</div>
          <h1 class="text-3xl font-bold text-emerald-900 mb-2">Register</h1>
        </div>

        {% if error %}
        <div class="mb-4 rounded-xl border-2 border-rose-300 bg-rose-50 text-rose-800 px-4 py-3 text-sm font-medium">⚠️ {{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="mb-4 rounded-xl border-2 border-emerald-400 bg-emerald-50 text-emerald-800 px-4 py-3 text-sm font-medium">✅ {{ success }}</div>
        {% endif %}

        <form method="post" action="/register" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-emerald-900 mb-1">Username</label>
            <input type="text" name="username" required class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          </div>
          <div>
            <label class="block text-sm font-bold text-emerald-900 mb-1">Email</label>
            <input type="email" name="email" required class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          </div>
          <div>
            <label class="block text-sm font-bold text-emerald-900 mb-1">Password</label>
            <input type="password" name="password" required minlength="6" class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          </div>
          <div>
            <label class="block text-sm font-bold text-emerald-900 mb-1">Role</label>
            <select name="role" class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3">
              <option value="scorer">Scorer — score matches (admin approval required)</option>
              <option value="player">Player — track my stats (auto-approved)</option>
            </select>
          </div>
          <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-6 py-4 text-lg font-bold shadow-lg">
            ✨ Register
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-emerald-700">
            Have an account? <a href="/login" class="font-bold text-teal-600 hover:text-teal-700 underline">Login</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
