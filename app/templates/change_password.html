<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Change Password — TT Scorer</title>
  </head>
  <body class="bg-gradient-to-br from-emerald-100 via-teal-100 to-sky-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <div class="bg-white rounded-3xl border-2 border-emerald-300 shadow-2xl p-8">
        <div class="text-center mb-6">
          <div class="text-5xl mb-2">🔐</div>
          <h1 class="text-2xl font-bold text-emerald-900">Change Password</h1>
          {% if forced %}
          <p class="mt-2 text-sm text-amber-800 bg-amber-50 border border-amber-300 rounded-lg px-3 py-2">
            An admin reset your password. Please set a new one to continue.
          </p>
          {% endif %}
        </div>
        {% if error %}<div class="mb-4 rounded-xl border-2 border-rose-300 bg-rose-50 text-rose-800 px-4 py-3 text-sm">⚠️ {{ error }}</div>{% endif %}
        {% if success %}<div class="mb-4 rounded-xl border-2 border-emerald-400 bg-emerald-50 text-emerald-800 px-4 py-3 text-sm">✅ {{ success }}</div>{% endif %}
        <form method="post" action="/change-password" class="space-y-4">
          <input type="password" name="current_password" placeholder="{% if forced %}Temp password from admin{% else %}Current password{% endif %}" required class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          <input type="password" name="new_password" placeholder="New password (6+ chars)" required minlength="6" class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          <input type="password" name="confirm_password" placeholder="Confirm new password" required class="w-full rounded-xl border-2 border-emerald-200 focus:border-emerald-400 px-4 py-3"/>
          <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-6 py-4 text-lg font-bold shadow-lg">Update Password</button>
        </form>
        <div class="mt-4 text-center">
          {% if forced %}
          <a href="/logout" class="text-sm text-rose-700 underline">Log out</a>
          {% else %}
          <a href="/" class="text-sm text-emerald-700 underline">← Back to Home</a>
          {% endif %}
        </div>
      </div>
    </div>
  </body>
</html>
